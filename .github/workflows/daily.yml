name: Daily collect and publish

on:
  schedule:
    - cron: "30 11 * * *"   # every day, 11:30 UTC (6:30 a.m. US Eastern)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshots into the data lake
        if: github.event_name != 'push'
        run: python3 collector/collect.py
      - name: Commit new snapshots
        if: github.event_name != 'push'
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add raw
          git diff --cached --quiet || git commit -m "Data snapshot $(date -u +%F)"
          git push
      - name: Build web page
        run: |
          python3 web/build.py
          mkdir -p _site && cp web/index.html _site/index.html && cp curated/drugs.json _site/drugs.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
