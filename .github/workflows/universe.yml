name: Weekly company universe and industry pipeline

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC, before the daily page build at 11:30
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["collector/universe.py", ".github/workflows/universe.yml"]

permissions:
  contents: write

concurrency:
  group: universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect company universe, SEC financials and ClinicalTrials.gov pipeline
        run: python3 collector/universe.py
      - name: Commit snapshot
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add raw/universe
          git diff --cached --quiet && exit 0
          git commit -m "Universe snapshot $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
